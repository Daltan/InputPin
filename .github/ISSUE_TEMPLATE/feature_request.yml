name: Feature request / 功能建议
description: Describe a use case or improvement / 描述使用场景或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and what currently gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 已尝试的替代方案
