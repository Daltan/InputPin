name: Bug report / 问题反馈
description: Report unexpected behavior with reproducible steps / 提交可复现的问题
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: macOS version, Mac chip, WeType version, and InputPin commit or version.
      placeholder: "macOS / Apple Silicon / 微信输入法版本 / InputPin 版本或 commit"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Include the affected app and whether secure input or another input manager is active.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断输出
      description: Paste --diagnose output if available. Review it for personal information first.
      render: text
