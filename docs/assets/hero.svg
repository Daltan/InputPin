<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">InputPin — Keep your input in place.</title>
  <desc id="desc">A dark banner with a mint pin symbol and a conceptual diagram showing ABC returning to WeType. Native Swift. Local only. Zero dependencies.</desc>
  <rect width="1280" height="480" rx="24" fill="#101917"/>
  <path d="M800 0V480M960 0V480M1120 0V480M720 80H1280M720 240H1280M720 400H1280" stroke="#20352E" stroke-opacity=".6"/>
  <circle cx="1060" cy="242" r="178" stroke="#2B443A"/>
  <circle cx="1060" cy="242" r="132" stroke="#2B443A" stroke-dasharray="3 9"/>
  <rect x="64" y="56" width="60" height="60" rx="18" fill="#B6F3CC"/>
  <path d="M85 71H103L100 82L107 89V93H96V104H92V93H81V89L88 82L85 71Z" fill="#14251D"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="142" y="94" fill="#B6F3CC" font-size="16" font-weight="600" letter-spacing="3">A SMALL UTILITY. A CALMER WORKFLOW.</text>
    <text x="60" y="211" fill="#F4F7F3" font-size="88" font-weight="700" letter-spacing="-4">InputPin</text>
    <text x="64" y="269" fill="#F4F7F3" font-size="34" font-weight="400" letter-spacing="-.5">Keep your input in place.</text>
    <text x="65" y="313" fill="#A3B8AC" font-size="19">A lightweight macOS menu bar utility for WeType.</text>
    <rect x="64" y="372" width="112" height="34" rx="17" stroke="#3B5146"/>
    <text x="120" y="394" fill="#B7C8BE" font-size="13" text-anchor="middle">Native Swift</text>
    <rect x="188" y="372" width="105" height="34" rx="17" stroke="#3B5146"/>
    <text x="240" y="394" fill="#B7C8BE" font-size="13" text-anchor="middle">Local only</text>
    <rect x="305" y="372" width="155" height="34" rx="17" stroke="#3B5146"/>
    <text x="382" y="394" fill="#B7C8BE" font-size="13" text-anchor="middle">Zero dependencies</text>
    <rect x="804" y="202" width="104" height="78" rx="18" fill="#1C2C25" stroke="#40564A"/>
    <text x="856" y="250" fill="#9EB3A5" text-anchor="middle" font-size="25">ABC</text>
    <path d="M924 241H987M978 232L987 241L978 250" stroke="#B6F3CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1006" y="175" width="144" height="132" rx="26" fill="#B6F3CC"/>
    <text x="1078" y="237" fill="#14251D" text-anchor="middle" font-size="27" font-weight="650">WeType</text>
    <rect x="1035" y="254" width="86" height="26" rx="13" fill="#14251D"/>
    <circle cx="1050" cy="267" r="3" fill="#B6F3CC"/>
    <text x="1083" y="271" fill="#B6F3CC" font-size="11" text-anchor="middle" letter-spacing="1">PINNED</text>
    <text x="984" y="360" fill="#8DA798" font-size="11" text-anchor="middle" letter-spacing="2">INPUT SOURCE RESTORATION</text>
  </g>
</svg>
